<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}无锡硕放机场地面车辆调度系统{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='icon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>

<header class="app-header">
    <div class="header-left">
        <img src="{{ url_for('static', filename='icon.png') }}" alt="" class="header-logo">
        <span class="header-title">无锡硕放机场地面车辆调度系统</span>
    </div>
    <div class="header-right">
        <span class="header-datetime" id="headerDatetime"></span>
        <span class="header-sep"></span>
        <span class="header-weather" id="headerWeather">--</span>
        <div class="theme-toggle" onclick="toggleTheme()">
            <span class="toggle-track"></span>
            <span class="theme-toggle-label" id="themeLabel">深色</span>
        </div>
    </div>
</header>

<main class="main">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="flash-messages">
        {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
</main>

<script src="{{ url_for('static', filename='base.js') }}"></script>

{% block scripts %}{% endblock %}

</body>
</html>
